<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Advisor</title>
<meta name="theme-color" content="#0A1636">
<meta name="apple-mobile-web-app-title" content="Pocket Advisor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap">
<style>
  /* Pocket Advisor launcher (new logo, dark look, 2026-11-16): carries the icon for the phone home screen, then opens the app. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
    background:radial-gradient(120% 80% at 50% 30%,#13286A 0%,#0A1636 58%,#050C22 100%);color:#fff;
    font:14px/1.5 Manrope,system-ui,sans-serif}
  .logo{width:min(70vw,300px);height:auto;animation:in .9s cubic-bezier(.2,.7,.2,1) both}
  .tag{font-weight:700;font-size:17px;line-height:1.45;margin-top:18px;animation:up .7s .3s both}
  .bar{width:min(62vw,240px);height:6px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:28px;overflow:hidden}
  .bar span{display:block;height:100%;width:40%;border-radius:6px;background:#4F86FF;animation:bar 1.4s ease-in-out infinite}
  .msg{color:#B9C6E6;margin-top:12px;min-height:21px}
  a.btn{display:inline-block;margin-top:18px;padding:11px 22px;border-radius:10px;background:#2A5BFF;color:#fff;text-decoration:none;font-weight:700}
  a.btn:focus-visible{outline:2px solid #8EC3FF;outline-offset:3px}
  .help{max-width:340px;color:#B9C6E6;margin-top:18px;font-size:13px}
  .store{width:min(60vw,230px);height:auto;margin-top:36px;animation:up .7s .5s both}
  [hidden]{display:none!important}
  @keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes bar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="Pocket Advisor">
  <div class="tag">Daily insight.<br>Connected teams.<br>Continuous improvement.</div>
  <div class="bar" id="bar"><span></span></div>
  <p class="msg" id="msg" role="status">Opening the app…</p>
  <a class="btn" id="open" hidden>Open Pocket Advisor</a>
  <p class="help" id="help" hidden>To put Pocket Advisor on your home screen: on iPhone tap Share, then <b>Add to Home Screen</b>. On Android tap the ⋮ menu, then <b>Add to Home screen</b>.</p>
<img class="store" src="store-logo.png" alt="Wilde East Towne Honda, Madison, WI">
<script>
  // The app's address: the Apps Script web app URL (Deploy > Manage deployments).
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyVVnr8cG8-e1yDDInk3cJD5LHzdllbVXNGmwgplto6ZLbciE6thzDYfAjdgIv4fbaC/exec';
  const ready = /^https:\/\/script\.google\.com\//.test(APP_URL);
  const fromHome = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const open = document.getElementById('open');
  // Keeps the sign-in (2026-11-21). Phones wipe the app's own saved sign-in when it closes, so this page holds it:
  // the app sends it here once after the emailed code (#t=...), and this page hands it to the app on every open.
  const keep = { get(){ try { return localStorage.getItem('pa_token'); } catch (e) { return null; } },
                 set(v){ try { v ? localStorage.setItem('pa_token', v) : localStorage.removeItem('pa_token'); } catch (e) {} } };
  const back = /^#(t=|signout)/.test(location.hash);
  if (/^#t=/.test(location.hash)) keep.set(decodeURIComponent(location.hash.slice(3)));
  if (location.hash === '#signout') keep.set(null);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  const tok = keep.get();
  const appUrl = APP_URL + '?home=1' + (tok ? '&t=' + encodeURIComponent(tok) : '');
  if (ready) open.href = appUrl;
  if (ready && (fromHome || back)) {
    // Tapped from the home screen: go straight into the app.
    setTimeout(() => location.replace(appUrl), back ? 300 : 900);
  } else {
    // Opened in a browser tab: offer the app and show how to add the icon.
    document.getElementById('bar').hidden = true;
    document.getElementById('msg').textContent = ready ? 'Add this page to your home screen for the Pocket Advisor icon.' : 'The app address isn’t set yet.';
    open.hidden = !ready;
    document.getElementById('help').hidden = false;
  }
</script>
</body>
</html>
