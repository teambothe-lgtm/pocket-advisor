<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Advisor</title>
<meta name="theme-color" content="#0d3d27">
<meta name="apple-mobile-web-app-title" content="Pocket Advisor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Public+Sans:wght@400;600&display=swap">
<style>
  /* Pocket Advisor launcher: carries the logo for the phone home screen, then opens the app. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
    background:radial-gradient(ellipse at 50% 40%,#216845 0%,#0d3d27 42%,#03190f 100%);color:#f1e8c9;
    font:14px/1.5 "Public Sans",system-ui,sans-serif}
  .stage{position:relative;width:min(66vw,300px);aspect-ratio:1;display:grid;place-items:center}
  .glow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(226,184,72,.2),rgba(226,184,72,0) 62%);animation:pulse 2.8s ease-in-out infinite}
  .mark{position:absolute;inset:0;background:url(logo.jpg) center/cover;overflow:hidden;
    -webkit-mask:radial-gradient(circle closest-side,#000 64%,transparent 97%);mask:radial-gradient(circle closest-side,#000 64%,transparent 97%);animation:in 1s cubic-bezier(.2,.7,.2,1) both}
  .shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,244,210,0) 38%,rgba(255,244,210,.3) 50%,rgba(255,244,210,0) 62%);transform:translateX(-130%);animation:shine 3s .8s ease-in-out infinite}
  h1{font:600 32px/1.2 "Source Serif 4",Georgia,serif;margin:2px 0 0;animation:up .8s .3s both}
  .store{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:#c9bd94;margin-top:6px;animation:up .8s .45s both}
  .bar{width:190px;height:2px;background:rgba(241,232,201,.16);margin-top:30px;overflow:hidden;border-radius:2px}
  .bar span{display:block;height:100%;width:45%;background:linear-gradient(90deg,rgba(226,184,72,0),#e2b848,rgba(226,184,72,0));animation:bar 1.5s ease-in-out infinite}
  .msg{color:#d4cba8;margin-top:12px;min-height:21px}
  a.btn{display:inline-block;margin-top:18px;padding:11px 22px;border:1px solid #e2b848;color:#f1e8c9;text-decoration:none;font-weight:600;border-radius:2px}
  a.btn:focus-visible{outline:2px solid #e2b848;outline-offset:3px}
  .help{max-width:340px;color:#d4cba8;margin-top:18px;font-size:13px}
  [hidden]{display:none!important}
  @keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes bar{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="stage" aria-hidden="true"><div class="glow"></div><div class="mark"><span class="shine"></span></div></div>
  <h1>Pocket Advisor</h1>
  <div class="store">Wilde East Towne Honda</div>
  <div class="bar" id="bar"><span></span></div>
  <p class="msg" id="msg" role="status">Opening the app…</p>
  <a class="btn" id="open" hidden>Open Pocket Advisor</a>
  <p class="help" id="help" hidden>To put Pocket Advisor on your home screen: on iPhone tap Share, then <b>Add to Home Screen</b>. On Android tap the ⋮ menu, then <b>Add to Home screen</b>.</p>
<script>
  // The app's address: the Apps Script web app URL (Deploy > Manage deployments).
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyVVnr8cG8-e1yDDInk3cJD5LHzdllbVXNGmwgplto6ZLbciE6thzDYfAjdgIv4fbaC/exec';
  const ready = /^https:\/\/script\.google\.com\//.test(APP_URL);
  const fromHome = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const open = document.getElementById('open');
  if (ready) open.href = APP_URL;
  if (ready && fromHome) {
    // Tapped from the home screen: go straight into the app.
    setTimeout(() => location.replace(APP_URL), 900);
  } else {
    // Opened in a browser tab: offer the app and show how to add the icon.
    document.getElementById('bar').hidden = true;
    document.getElementById('msg').textContent = ready ? 'Add this page to your home screen for the Pocket Advisor icon.' : 'The app address isn’t set yet.';
    open.hidden = !ready;
    document.getElementById('help').hidden = false;
  }
</script>
</body>
</html>
